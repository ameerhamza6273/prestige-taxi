<script>
  // GHL API Settings
  var GHL_URL = "https://services.leadconnectorhq.com/hooks/YOUR_WEBHOOK_URL_OR_API"; // Apna sahi endpoint yahan dalen
  var GHL_AUTH = "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJsb2NhdGlvbl9pZCI6Ik5hT2dORVR4SE5IaFBSTFRsZWM1IiwiY29tcGFueV9pZCI6IjhNbnU4ZXNITHUzVDV2d25GeGFrIiwidmVyc2lvbiI6MSwiaWF0IjoxNjkwNTYxNzc5OTkyLCJzdWIiOiJ1c2VyX2lkIn0.oj-bctQvctKuoEAHWWKRYWekZVJBHxEhw1aZ41Vg3XE";

  var questions = [
    { q: "Does your business have a Google Business Profile set up?", opts: [{ text: "Yes — verified and actively managed", pts: 3 }, { text: "Yes, but I haven't really touched it", pts: 2 }, { text: "I think so — not sure if it's verified", pts: 1 }, { text: "No, I don't have one yet", pts: 0 }] },
    { q: "How is most of your new business coming in right now?", opts: [{ text: "Referrals and word of mouth mostly", pts: 1 }, { text: "I run paid ads (Google or Facebook)", pts: 2 }, { text: "A mix of ads, SEO, and referrals", pts: 3 }, { text: "It's inconsistent — I need more leads", pts: 3 }] },
    { q: "When a homeowner searches your service in your city, where do you show up?", opts: [{ text: "Top 3 on Google Maps consistently", pts: 1 }, { text: "Sometimes in the map pack, sometimes not", pts: 2 }, { text: "I rarely show up in the map pack", pts: 3 }, { text: "Honestly, I have no idea where I rank", pts: 3 }] },
    { q: "How competitive is your local market?", opts: [{ text: "Very competitive — lots of established players", pts: 3 }, { text: "Moderate — some competition, room to grow", pts: 2 }, { text: "Low — not many competitors in my area", pts: 1 }, { text: "Not sure", pts: 2 }] },
    { q: "What's your biggest frustration getting new clients?", opts: [{ text: "Paying too much per lead through ads", pts: 3 }, { text: "Getting leads but the quality is low", pts: 2 }, { text: "Just not enough volume consistently", pts: 3 }, { text: "Not sure what's not working", pts: 2 }] },
    { q: "Are you the owner or decision-maker for marketing?", opts: [{ text: "Yes, I make all marketing decisions", pts: 3 }, { text: "I share decisions with a partner", pts: 2 }, { text: "I have someone else handle marketing", pts: 1 }, { text: "No — I'd need to check with someone", pts: 0 }] },
    { q: "If we showed you real ranking movement in 10 days at zero cost, what would you do?", opts: [{ text: "Ready to move forward immediately", pts: 3 }, { text: "I'd review the results then decide", pts: 2 }, { text: "I'd need to compare a few options first", pts: 1 }, { text: "I'm just browsing for now", pts: 0 }] }
  ];

  var current = 0;
  var scores = [];
  var selected = null;
  var keys = ['A','B','C','D'];

  function buildPips() {
    var c = document.getElementById('qPips');
    if(!c) return;
    c.innerHTML = '';
    for (var i = 0; i < questions.length; i++) {
      var pip = document.createElement('div');
      pip.className = 'progress-pip' + (i < current ? ' done' : i === current ? ' active' : '');
      c.appendChild(pip);
    }
  }

  function renderQuestion() {
    selected = null;
    buildPips();
    var q = questions[current];
    var optsHtml = '';
    for (var i = 0; i < q.opts.length; i++) {
      optsHtml += '<div class="opt" data-i="' + i + '" onclick="selectOpt(this,' + i + ')">'
        + '<span class="opt-key">' + keys[i] + '</span>'
        + '<span class="opt-label">' + q.opts[i].text + '</span>'
        + '</div>';
    }
    document.getElementById('qCard').innerHTML =
      '<p class="q-counter">Question ' + (current + 1) + ' of ' + questions.length + '</p>'
      + '<p class="q-text">' + q.q + '</p>'
      + '<div class="opts">' + optsHtml + '</div>'
      + '<button class="btn-next" id="btnNext" disabled onclick="advance()">'
      + (current < questions.length - 1 ? 'Next question &rarr;' : 'See my results &rarr;')
      + '</button>';
  }

  function selectOpt(el, i) {
    var opts = document.querySelectorAll('.opt');
    for (var j = 0; j < opts.length; j++) opts[j].classList.remove('selected');
    el.classList.add('selected');
    selected = i;
    document.getElementById('btnNext').disabled = false;
  }

  function advance() {
    if (selected === null) return;
    
    // LocalStorage mein answer save karein
    localStorage.setItem("quiz_q" + (current + 1), questions[current].opts[selected].text);
    scores.push(questions[current].opts[selected].pts);
    
    current++;
    if (current < questions.length) {
      renderQuestion();
    } else {
      renderLeadForm();
    }
  }

  function renderLeadForm() {
    buildPips(); 
    document.getElementById('qCard').innerHTML = `
      <div class="result-wrap">
        <p class="q-counter">Almost there!</p>
        <p class="q-text">Where should we send your personalized Local SEO report?</p>
        <div class="opts" style="text-align: left; gap: 15px;">
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-size: 13px; font-weight: 600; color: #5a5a55;">Full Name</label>
            <input type="text" id="userName" placeholder="John Doe" style="padding: 12px; border-radius: 8px; border: 1.5px solid #e4e2da; width:100%;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-size: 13px; font-weight: 600; color: #5a5a55;">Email Address</label>
            <input type="email" id="userEmail" placeholder="john@example.com" style="padding: 12px; border-radius: 8px; border: 1.5px solid #e4e2da; width:100%;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-size: 13px; font-weight: 600; color: #5a5a55;">Phone Number</label>
            <input type="tel" id="userPhone" placeholder="(555) 000-0000" style="padding: 12px; border-radius: 8px; border: 1.5px solid #e4e2da; width:100%;">
          </div>
        </div>
        <button class="btn-next" onclick="submitLeadForm()">Reveal My Score &rarr;</button>
      </div>
    `;
  }

 function submitLeadForm() {
    var name = document.getElementById('userName').value.trim();
    var email = document.getElementById('userEmail').value.trim();
    var phone = document.getElementById('userPhone').value.trim();

    // 1. Name Validation (Kam az kam 2 huroof hon)
    if (name.length < 2) {
        alert("Please enter your full name.");
        document.getElementById('userName').focus();
        return;
    }

    // 2. Email Validation (Regex pattern jo check karega @ aur . sahi jagah hain)
    var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        alert("Please enter a valid email address (e.g. name@company.com).");
        document.getElementById('userEmail').focus();
        return;
    }

    // 3. Phone Validation (Sirf numbers aur kam az kam 10 digits)
    var phoneDigits = phone.replace(/\D/g, ''); // Numbers ke ilawa sab hata do
    if (phoneDigits.length < 10) {
        alert("Please enter a valid phone number (at least 10 digits).");
        document.getElementById('userPhone').focus();
        return;
    }

    // Agar sab theek hai, toh save karein aur result dikhayein
    localStorage.setItem("user_name", name);
    localStorage.setItem("user_email", email);
    localStorage.setItem("user_phone", phone);

    showResult();
}

  function showResult() {
    var total = 0;
    for (var i = 0; i < scores.length; i++) total += scores[i];
    var pct = Math.round((total / (questions.length * 3)) * 100);
    localStorage.setItem("quiz_score", pct);

    var isHigh = pct >= 65;
    var badge = isHigh ? 'Strong fit — high priority' : "Good potential — let's talk";
    var title = isHigh ? 'Prime candidate for the free 10-day boost' : "There's opportunity here";

    document.getElementById('qCard').innerHTML = `
      <div class="result-wrap">
        <div class="result-icon ${isHigh ? 'icon-high' : 'icon-med'}">${isHigh ? '✓' : '→'}</div>
        <span class="result-badge ${isHigh ? 'badge-high' : 'badge-med'}">${badge}</span>
        <p class="result-title">${title}</p>
        <div class="score-bar-wrap">
          <p class="score-bar-label">Your fit score</p>
          <div class="score-bar-track"><div class="score-bar-fill" style="width: ${pct}%"></div></div>
          <p class="score-number">${pct}% match</p>
        </div>
        <button class="btn-cta" id="finalSubmitBtn" onclick="sendToGHL()">Claim My Free 10-Day SEO Boost &rarr;</button>
        <p class="cta-sub">Click above to finalize your request.</p>
      </div>`;
  }

 async function sendToGHL() {
    const btn = document.getElementById('finalSubmitBtn');
    btn.innerText = "Processing...";
    btn.disabled = true;

    // GHL V2 API URL
    const url = "https://services.leadconnectorhq.com/contacts/"; 
    const PIT_TOKEN = "pit-94c417b5-2dee-4a53-8ea7-4202ccb28942"; 
    const MY_LOCATION_ID = "84sadHh8FJOAdArRZ3QQ"; 

    // Name splitting logic (GHL V2 prefers firstName and lastName)
    let fullName = (localStorage.getItem("user_name") || "Quiz User").trim();
    let nameParts = fullName.split(" ");
    let fName = nameParts[0];
    let lName = nameParts.length > 1 ? nameParts.slice(1).join(" ") : "Lead";

    // ONLY MAIN DATA (Custom fields commented out as requested)
    let data = {
        firstName: fName,
        lastName: lName,
        email: localStorage.getItem("user_email"),
        phone: localStorage.getItem("user_phone"),
        locationId: MY_LOCATION_ID,
        type: "Lead"
        /* 
        customFields: [
            { key: "quiz_score", value: localStorage.getItem("quiz_score") }
        ] 
        */
    };

    console.log("📨 Sending Basic Data:", JSON.stringify(data, null, 2));

    try {
        let response = await fetch(url, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + PIT_TOKEN,
                "Content-Type": "application/json",
                "Version": "2021-07-28",
                "Accept": "application/json"
            },
            body: JSON.stringify(data)
        });

        console.log("📡 Status Code:", response.status);
        let result = await response.json();
        console.log("🔍 API Response:", result);

        if (response.ok || response.status === 201) {
            console.log("✅ Basic Contact Created!");
            showThankYou();
        } else {
            console.error("❌ GHL Error:", result);
            showThankYou(); 
        }
    } catch (error) {
        console.error("❌ Network Error:", error);
        showThankYou();
    }
}
  function showThankYou() {
    document.getElementById('qCard').innerHTML = `
      <div class="result-wrap" style="padding: 40px 10px;">
        <div class="result-icon icon-high">✓</div>
        <h2 class="result-title">Success! Your request is in.</h2>
        <p class="result-desc">Thank you <b>${localStorage.getItem("user_name")}</b>. We have received your details and our team will contact you at <b>${localStorage.getItem("user_email")}</b> within 24 hours to start your 10-day boost.</p>
        <div class="divider"></div>
        <p class="cta-sub">You can close this window now.</p>
      </div>
    `;
  }

  renderQuestion();
</script>
